name: Verify Ask Ashish AI

on:
  push:
    branches:
      - feature/ask-ashish-ai
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install portfolio dependencies
        run: npm ci

      - name: Build static portfolio
        run: npm run build
        env:
          NEXT_PUBLIC_ASK_ASHISH_API_URL: ${{ vars.NEXT_PUBLIC_ASK_ASHISH_API_URL }}

      - name: Install Cloudflare Worker dependencies
        working-directory: assistant-api
        run: npm install

      - name: Check Worker JavaScript syntax
        working-directory: assistant-api
        run: npm run check

      - name: Validate Wrangler configuration
        working-directory: assistant-api
        run: npx wrangler deploy --dry-run
